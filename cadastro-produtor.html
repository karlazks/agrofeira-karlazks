<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroFeira - Cadastro de produtor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <a href="#conteudo" class="pular">Pular para o conteúdo</a>

  <header class="cabecalho-site">
    <h1>AgroFeira</h1>
    <nav aria-label="Principal">
      <ul class="menu">
        <li><a href="index.html">Início</a></li>
        <li><a href="safra.html">Safra</a></li>
        <li><a href="cadastro-produtor.html" aria-current="page">Cadastro de produtor</a></li>
        <li><a href="sobre.html">Sobre</a></li>
      </ul>
    </nav>
  </header>

  <main id="conteudo">

    <h2>Cadastro de produtor</h2>

    <form class="formulario-cadastro">

      <fieldset>
        <legend>Quem é você</legend>

        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required autocomplete="name">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="email">

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" autocomplete="tel">

        <label for="caf">Número do CAF</label>
        <input type="text" id="caf" name="caf">

        <label for="cep">CEP da propriedade</label>
        <input
          type="text"
          id="cep"
          name="cep"
          inputmode="numeric"
          pattern="[0-9]{5}-?[0-9]{3}"
          aria-describedby="cep-ajuda">
        <p id="cep-ajuda">Formato: 00000-000</p>

      </fieldset>

      <fieldset>
        <legend>O que você vende</legend>

        <label for="produto">Produto principal</label>
        <select id="produto" name="produto" required>
          <option value="">Escolha um produto</option>
          <option value="mandioca">Mandioca</option>
          <option value="banana">Banana-prata</option>
          <option value="acai">Açaí</option>
          <option value="pimenta">Pimenta-do-reino</option>
          <option value="cupuacu">Cupuaçu</option>
          <option value="alface">Alface</option>
        </select>

        <label for="quantidade">Quantidade por semana</label>
        <input
          type="number"
          id="quantidade"
          name="quantidade"
          min="1"
          max="500"
          step="1"
          required>

        <label for="data-entrega">Começa a entregar em</label>
        <input type="date" id="data-entrega" name="data-entrega">

        <fieldset>
          <legend>Como entrega</legend>

          <label for="entrega-feira">
            <input type="radio" id="entrega-feira" name="entrega" value="feira">
            Leva à feira
          </label>

          <label for="entrega-propriedade">
            <input type="radio" id="entrega-propriedade" name="entrega" value="propriedade">
            A feira retira na propriedade
          </label>

        </fieldset>

        <label for="observacao">Observação</label>
        <textarea id="observacao" name="observacao" rows="5"></textarea>

        <label for="aceite">
          <input type="checkbox" id="aceite" name="aceite" required>
          Declaro que as informações fornecidas são verdadeiras e aceito as regras da AgroFeira.
        </label>

      </fieldset>

      <button type="submit">Enviar cadastro</button>

    </form>

    <p role="status"></p>

  </main>

  <footer class="rodape-site">
    <p>Agricultura familiar de Paragominas.</p>
  </footer>

</body>
</html>
